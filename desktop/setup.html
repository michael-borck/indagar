<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indagar Setup</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(700px 400px at 10% -10%, rgba(45, 212, 191, 0.35), transparent 60%),
        #0b1f1c;
      color: #e7efed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: min(460px, calc(100% - 40px));
    }
    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #2dd4bf;
      color: #06201d;
      font-size: 22px;
      font-weight: 800;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: #9db3ae;
      font-size: 13px;
      line-height: 1.5;
    }
    .bar {
      position: relative;
      height: 5px;
      margin: 22px 0 14px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 35%;
      border-radius: inherit;
      background: #2dd4bf;
      animation: sweep 1.2s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
    pre {
      height: 130px;
      margin: 0;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      color: #c7d7d3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .note {
      margin-top: 10px;
      color: #7f9993;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">I</div>
    <h1>Preparing Indagar</h1>
    <p>Installing the local research engine. This happens once per version.</p>
    <div class="bar"></div>
    <pre id="log"></pre>
    <p class="note">The engine is stored in your application data folder. An internet connection is needed for first-time setup.</p>
  </main>
  <script>
    const log = document.getElementById("log");
    window.setupAPI.onLog((line) => {
      log.textContent += `${line}\n`;
      log.scrollTop = log.scrollHeight;
    });
  </script>
</body>
</html>
